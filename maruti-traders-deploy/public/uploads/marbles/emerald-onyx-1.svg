<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_emeraldonyx1svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f382c" />
      <stop offset="50%" stop-color="#0f382c" />
      <stop offset="100%" stop-color="#2a9d8f" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_emeraldonyx1svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M0,100 Q150,50 350,120 T700,80 T800,150 L800,160 Q690,90 340,130 T0,110 Z M0,220 Q200,180 450,250 T800,210 L800,220 Q440,260 190,190 T0,230 Z" fill="#2a9d8f" opacity="0.6" />
  <path d="M0,100 Q150,50 350,120 T700,80 T800,150 L800,160 Q690,90 340,130 T0,110 Z M0,220 Q200,180 450,250 T800,210 L800,220 Q440,260 190,190 T0,230 Z" fill="#d4af37" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(0,0,0,0.75)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    Emerald Green Translucent Onyx
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    MARUTI TRADERS • 18mm Backlit Grade Translucent Onyx
  </text>
</svg>