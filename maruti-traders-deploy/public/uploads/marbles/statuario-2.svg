<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_statuario2svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#6c757d" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_statuario2svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M400,0 Q350,150 200,250 T0,350 L0,360 Q220,270 370,160 T400,10 Z M400,0 Q450,150 600,250 T800,350 L800,360 Q580,270 430,160 T400,10 Z" fill="#6c757d" opacity="0.6" />
  <path d="M400,0 Q350,150 200,250 T0,350 L0,360 Q220,270 370,160 T400,10 Z M400,0 Q450,150 600,250 T800,350 L800,360 Q580,270 430,160 T400,10 Z" fill="#343a40" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(255,255,255,0.88)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Statuario Bookmatched Slab Pair
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
    MARUTI TRADERS • Bookmatched Pair • Slabs #42-43
  </text>
</svg>