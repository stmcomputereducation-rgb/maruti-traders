<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_blackmarquina1svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111418" />
      <stop offset="50%" stop-color="#111418" />
      <stop offset="100%" stop-color="#dee2e6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_blackmarquina1svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M0,120 L250,80 L350,160 L580,70 L800,140 L800,146 L575,76 L345,166 L245,86 L0,126 Z M180,0 L290,110 L450,90 L620,240 L800,200 L800,205 L615,245 L445,95 L285,115 L175,0 Z" fill="#dee2e6" opacity="0.6" />
  <path d="M0,120 L250,80 L350,160 L580,70 L800,140 L800,146 L575,76 L345,166 L245,86 L0,126 Z M180,0 L290,110 L450,90 L620,240 L800,200 L800,205 L615,245 L445,95 L285,115 L175,0 Z" fill="#ffffff" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(0,0,0,0.75)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    Nero Marquina Black Marble
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    MARUTI TRADERS • 18mm Polished • Deep Black with White Veins
  </text>
</svg>