<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_botticino1svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4ede1" />
      <stop offset="50%" stop-color="#f4ede1" />
      <stop offset="100%" stop-color="#ded0bc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_botticino1svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M0,150 Q250,180 500,120 T800,190 L800,195 Q520,130 260,190 T0,155 Z M50,50 Q300,40 550,80 T800,40 L800,45 Q560,85 310,45 T50,55 Z" fill="#ded0bc" opacity="0.6" />
  <path d="M0,150 Q250,180 500,120 T800,190 L800,195 Q520,130 260,190 T0,155 Z M50,50 Q300,40 550,80 T800,40 L800,45 Q560,85 310,45 T50,55 Z" fill="#c2ab8f" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(255,255,255,0.88)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Botticino Classico Italian Marble
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
    MARUTI TRADERS • 18mm Honed & Polished • Brescia Italy
  </text>
</svg>