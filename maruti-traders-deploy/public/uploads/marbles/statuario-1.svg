<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_statuario1svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa" />
      <stop offset="50%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#adb5bd" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_statuario1svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M0,80 Q150,20 300,110 T600,70 T900,160 L900,170 Q750,110 600,90 T300,130 T0,90 Z M120,0 Q220,120 400,200 T700,260 L700,270 Q480,220 350,140 T120,10 Z" fill="#adb5bd" opacity="0.6" />
  <path d="M0,80 Q150,20 300,110 T600,70 T900,160 L900,170 Q750,110 600,90 T300,130 T0,90 Z M120,0 Q220,120 400,200 T700,260 L700,270 Q480,220 350,140 T120,10 Z" fill="#495057" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(255,255,255,0.88)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Statuario White Italian Marble
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">
    MARUTI TRADERS • 18mm Mirror Polish • Carrara Italy
  </text>
</svg>