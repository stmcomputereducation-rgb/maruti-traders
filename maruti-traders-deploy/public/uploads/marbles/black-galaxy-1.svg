<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad_blackgalaxy1svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Marble Slab Base -->
  <rect width="800" height="500" fill="url(#grad_blackgalaxy1svg)" />

  <!-- Natural Marble Veining Patterns -->
  <path d="M100,50 A5,5 0 1,1 100,60 A5,5 0 1,1 100,50 M300,120 A6,6 0 1,1 300,132 A6,6 0 1,1 300,120 M550,80 A7,7 0 1,1 550,94 A7,7 0 1,1 550,80 M720,180 A5,5 0 1,1 720,190 A5,5 0 1,1 720,180 M200,280 A8,8 0 1,1 200,296 A8,8 0 1,1 200,280 M450,220 A6,6 0 1,1 450,232 A6,6 0 1,1 450,220 M680,290 A7,7 0 1,1 680,304 A7,7 0 1,1 680,290 M150,180 A4,4 0 1,1 150,188 A4,4 0 1,1 150,180 M380,320 A5,5 0 1,1 380,330 A5,5 0 1,1 380,320 M600,20 A5,5 0 1,1 600,30 A5,5 0 1,1 600,20 M80,340 A6,6 0 1,1 80,352 A6,6 0 1,1 80,340" fill="#ffd166" opacity="0.6" />
  <path d="M100,50 A5,5 0 1,1 100,60 A5,5 0 1,1 100,50 M300,120 A6,6 0 1,1 300,132 A6,6 0 1,1 300,120 M550,80 A7,7 0 1,1 550,94 A7,7 0 1,1 550,80 M720,180 A5,5 0 1,1 720,190 A5,5 0 1,1 720,180 M200,280 A8,8 0 1,1 200,296 A8,8 0 1,1 200,280 M450,220 A6,6 0 1,1 450,232 A6,6 0 1,1 450,220 M680,290 A7,7 0 1,1 680,304 A7,7 0 1,1 680,290 M150,180 A4,4 0 1,1 150,188 A4,4 0 1,1 150,180 M380,320 A5,5 0 1,1 380,330 A5,5 0 1,1 380,320 M600,20 A5,5 0 1,1 600,30 A5,5 0 1,1 600,20 M80,340 A6,6 0 1,1 80,352 A6,6 0 1,1 80,340" fill="#e5a93b" opacity="0.85" filter="url(#shadow)" />

  <!-- Subtle Polish Sheen Overlay -->
  <rect width="800" height="500" fill="white" opacity="0.04" />
  <line x1="0" y1="0" x2="800" y2="500" stroke="white" stroke-width="1.5" opacity="0.1" stroke-dasharray="20,40" />

  <!-- Slab Corner Watermark & Info Label -->
  <rect x="24" y="400" width="752" height="76" rx="12" fill="rgba(0,0,0,0.75)" filter="url(#shadow)" />
  <text x="44" y="432" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">
    Black Galaxy Granite (Star Galaxy)
  </text>
  <text x="44" y="458" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
    MARUTI TRADERS • 18mm High Gloss Polished • Golden Bronzite Flakes
  </text>
</svg>